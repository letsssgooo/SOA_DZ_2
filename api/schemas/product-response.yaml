description: Ответ с данными товара
type: object
required:
  - id
  - name
  - price
  - stock
  - category
  - status
  - created_at
  - updated_at
properties:
  id:
    type: string
    format: uuid
  name:
    type: string
  description:
    type: string
    nullable: true
  price:
    type: number
    format: decimal
    minimum: 0
    exclusiveMinimum: true
  stock:
    type: integer
    minimum: 0
  category:
    type: string
  status:
    type: string
    enum:
      - ACTIVE
      - INACTIVE
      - ARCHIVED
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
